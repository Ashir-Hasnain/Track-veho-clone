<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

  <header>
    <nav>
      <div class="logo">
        <a href="https://www.shipveho.com/">
          <img src="https://track.shipveho.com/veho-logo.svg" alt="Veho Logo">
        </a>
      </div>
    </nav>
  </header>


  <div class="container-view">
    <header>

      <a href="/" class="back-btn">back</a>

    <div class="tracking">


      <div class="shipment-facts">
        <h2 class="section-title">Shipment facts</h2>

        <div class="sub-section-header">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z" />

        <div class="sub-section-header">
          <svg viewBox="0 0 24 24">

          </svg>
          Services
        </div>
        <table class="data-table" id="table-services"></table>

        <div class="sub-section-header">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 6h-2c0-2.21-1.79-4-4-4S9 3.79 9 6H7c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H7V8h2v2h2V8h2v2h2V8h2v12z" />
          </svg>
          Package details
        </div>
        <table class="data-table" id="table-package"></table>
      </div>

    </div>
